name: Build Nex Pic

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/nexpic.jks
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KS_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore app/nexpic.jks -storetype PKCS12 \
              -alias nexpic -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nexpic123 -keypass nexpic123 \
              -dname "CN=Nex Pic, OU=Nex, O=Nex, C=ID"
          fi

      - name: Build APK release (R8 + shrink resources)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NexPic-${{ github.run_number }}.apk
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexPic-release
          path: dist/*.apk

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
